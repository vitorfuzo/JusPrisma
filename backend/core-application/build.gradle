// Casos de uso e portas (interfaces). Depende só do domínio.
//
// Usa spring-context e spring-tx para @Service e @Transactional. É uma concessão
// deliberada: transação é preocupação de caso de uso, e reimplementar o gerenciamento
// dela para manter pureza custaria mais do que entrega. O domínio, esse sim, segue
// sem framework nenhum — garantido por teste de arquitetura.
dependencies {
    api project(':backend:core-domain')
    api 'org.springframework:spring-context'
    api 'org.springframework:spring-tx'
    implementation 'org.slf4j:slf4j-api'
}
