dependencies {
    implementation project(':backend:core-application')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    // Boot 4 tirou as auto-configurações de spring-boot-autoconfigure e as distribuiu em
    // módulos próprios. Sem este artefato o Flyway está no classpath e simplesmente não
    // roda — as migrations não são aplicadas e o erro aparece como "relation does not exist".
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation libs.pgvector
    // Leitura do JSONB de limites de plano. Declarado aqui de proposito: o modulo
    // nao deve depender de o Jackson chegar por transitividade de outro starter.
    implementation 'tools.jackson.core:jackson-databind'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    // Testcontainers 2.x renomeou os modulos: 'postgresql' e 'junit-jupiter'
    // viraram 'testcontainers-postgresql' e 'testcontainers-junit-jupiter'.
    // Os nomes antigos ainda existem no Maven Central parados no 1.x, e mistura-los
    // com o core 2.x quebra em runtime por classe sombreada removida.
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
}
