// Clients TJDFT, DataJud, DJEN. Toda chamada externa passa por Resilience4j.
dependencies {
    implementation project(':backend:core-application')
    // O classificador de dispositivo e' dominio puro, e o smoke test de
    // cobertura o exercita contra dados reais do tribunal.
    testImplementation project(':backend:core-domain')
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    // Mesmo padrao do Flyway: o Boot 4 tirou as auto-configuracoes de
    // spring-boot-autoconfigure. Sem este artefato nao existe bean de
    // WebClient.Builder e a injecao falha na subida do contexto.
    implementation 'org.springframework.boot:spring-boot-webclient'
    implementation libs.resilience4j.spring.boot
    // As anotacoes do Resilience4j sao aspectos. Sem AspectJ no classpath elas
    // simplesmente nao fazem nada; hoje ele so chegava por acaso, via JPA.
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation libs.resilience4j.reactor
    implementation 'tools.jackson.core:jackson-databind'

    testImplementation libs.wiremock
}
