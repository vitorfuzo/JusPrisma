spring:
  application:
    name: jusprisma
  datasource:
    url: ${JUSPRISMA_DB_URL:jdbc:postgresql://localhost:5432/jusprisma}
    username: ${JUSPRISMA_DB_USER:jusprisma_app}
    password: ${JUSPRISMA_DB_PASSWORD}
  jpa:
    # Schema é responsabilidade do Flyway. ddl-auto nunca sai de "none" (CLAUDE.md).
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    # Migrations rodam com role dona das tabelas, distinta da role da aplicação,
    # para que o RLS não seja ignorado por ownership — ver ADR 0001, seção 5.
    user: ${JUSPRISMA_DB_MIGRATION_USER:jusprisma_owner}
    password: ${JUSPRISMA_DB_MIGRATION_PASSWORD}
  mail:
    host: ${JUSPRISMA_MAIL_HOST:localhost}
    port: ${JUSPRISMA_MAIL_PORT:1025}

server:
  port: ${JUSPRISMA_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# MIN_AMOSTRA não aparece aqui de propósito: é constante de domínio
# (br.com.jusprisma.dominio.estatistica.Amostra.MINIMO). Se fosse configurável,
# bastaria baixá-la em produção para violar a regra inviolável 2 em silêncio.

jusprisma:
  jwt:
    segredo: ${JUSPRISMA_JWT_SECRET}
  cookie:
    # Falso apenas em desenvolvimento sobre http; o navegador recusaria um cookie
    # Secure numa origem insegura. Em qualquer outro ambiente permanece true.
    seguro: ${JUSPRISMA_COOKIE_SEGURO:true}
