spring:
  application:
    name: jusprisma
  datasource:
    url: ${JUSPRISMA_DB_URL:jdbc:postgresql://localhost:5432/jusprisma}
    username: ${JUSPRISMA_DB_USER:jusprisma_app}
    password: ${JUSPRISMA_DB_PASSWORD}
  jpa:
    # Schema é responsabilidade do Flyway. ddl-auto nunca sai de "none" (CLAUDE.md).
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    # Migrations rodam com role dona das tabelas, distinta da role da aplicação,
    # para que o RLS não seja ignorado por ownership — ver ADR 0001, seção 5.
    user: ${JUSPRISMA_DB_MIGRATION_USER:jusprisma_owner}
    password: ${JUSPRISMA_DB_MIGRATION_PASSWORD}
  mail:
    host: ${JUSPRISMA_MAIL_HOST:localhost}
    port: ${JUSPRISMA_MAIL_PORT:1025}

server:
  port: ${JUSPRISMA_PORT:8080}

logging:
  # Em dev, log legível no console. Em produção, JSON estruturado — cada linha vira um
  # documento indexável, com o correlacaoId do MDC como campo de primeira classe.
  # Vazio desliga a formatação estruturada e volta ao padrão legível.
  structured:
    format:
      console: ${JUSPRISMA_LOG_ESTRUTURADO:}
  pattern:
    # No formato legível o correlacaoId entra entre colchetes, logo antes do logger.
    correlation: "[${spring.application.name:jusprisma},%X{correlacaoId:-}] "

resilience4j:
  retry:
    instances:
      asaas:
        max-attempts: 3
        wait-duration: 500ms
        # Backoff exponencial: repetir em intervalo fixo contra um serviço que está se
        # recuperando de sobrecarga só prolonga a sobrecarga.
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # Recusa de dados (4xx) não melhora repetindo, e não é falha do gateway: não conta
        # para abrir o circuito nem dispara retentativa.
        ignore-exceptions:
          - br.com.jusprisma.aplicacao.cobranca.CobrancaRecusadaException
  circuitbreaker:
    instances:
      asaas:
        sliding-window-size: 20
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - br.com.jusprisma.aplicacao.cobranca.CobrancaRecusadaException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# MIN_AMOSTRA não aparece aqui de propósito: é constante de domínio
# (br.com.jusprisma.dominio.estatistica.Amostra.MINIMO). Se fosse configurável,
# bastaria baixá-la em produção para violar a regra inviolável 2 em silêncio.

jusprisma:
  jwt:
    segredo: ${JUSPRISMA_JWT_SECRET}
  cookie:
    # Falso apenas em desenvolvimento sobre http; o navegador recusaria um cookie
    # Secure numa origem insegura. Em qualquer outro ambiente permanece true.
    seguro: ${JUSPRISMA_COOKIE_SEGURO:true}
  email:
    remetente: ${JUSPRISMA_EMAIL_REMETENTE:nao-responda@jusprisma.com.br}
  rede:
    atras-de-proxy: ${JUSPRISMA_ATRAS_DE_PROXY:false}
  app:
    # Base dos links enviados por e-mail. Aponta para o frontend, não para a API.
    url-base: ${JUSPRISMA_APP_URL_BASE:http://localhost:5173}
  operador-inicial:
    # Cria o primeiro operador da plataforma, só quando a tabela está vazia.
    # Remova a senha do ambiente depois da primeira subida.
    email: ${JUSPRISMA_OPERADOR_INICIAL_EMAIL:}
    senha: ${JUSPRISMA_OPERADOR_INICIAL_SENHA:}
    nome: ${JUSPRISMA_OPERADOR_INICIAL_NOME:Operador}
  jobs:
    habilitados: ${JUSPRISMA_JOBS_HABILITADOS:true}
  asaas:
    url-base: ${JUSPRISMA_ASAAS_BASE_URL:https://api-sandbox.asaas.com/v3}
    chave: ${JUSPRISMA_ASAAS_API_KEY:}
    # Token que o Asaas envia no cabeçalho da notificação. Sem ele configurado, toda
    # notificação é recusada — a rota é pública, e aceitar sem conferir é pior que negar.
    token-webhook: ${JUSPRISMA_ASAAS_WEBHOOK_TOKEN:}
