name: jusprisma

services:
  postgres:
    # pgvector já embutido: busca semântica é requisito da Fase 2 e não queremos
    # trocar de imagem no meio do caminho.
    image: pgvector/pgvector:pg16
    container_name: jusprisma-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jusprisma}
      POSTGRES_USER: ${POSTGRES_USER:-jusprisma_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      # Consumidos pelo script de init para criar a role da aplicação.
      JUSPRISMA_DB_USER: ${JUSPRISMA_DB_USER:-jusprisma_app}
      JUSPRISMA_DB_PASSWORD: ${JUSPRISMA_DB_PASSWORD:?defina JUSPRISMA_DB_PASSWORD no .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5
    container_name: jusprisma-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    # Sucessor mantido do MailHog, que está sem manutenção desde 2020.
    # Mesma função: captura todo e-mail enviado em dev, nada sai para fora.
    image: axllent/mailpit:latest
    container_name: jusprisma-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # interface web
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres-dados:
